[project]
name = "mitsubishi-connect"
version = "0.1.0"
description = "Async Python SDK and encrypted transport layer for Mitsubishi Motors Connected Services (wrapping the OpenAPI-generated client)"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43.0.0",
    "httpx2>=2.13.1,<3",
    "mitsubishi-connect-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mitsubishi_connect"]
