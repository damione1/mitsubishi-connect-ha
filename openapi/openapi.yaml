components:
  securitySchemes:
    KntAccessToken:
      type: apiKey
      in: header
      name: knt-access-token
      description: Raw IDM access token (no `Bearer ` prefix)
    IdmBearer:
      type: http
      scheme: bearer
      description: 'IDM access token as `Authorization: Bearer <accessToken>`.'
  parameters:
    VinQuery:
      name: vin
      in: query
      required: true
      schema:
        type: string
        example: JA4XXXXXXXXXXXXXX
      description: 17-character Vehicle Identification Number (VIN)
    InternalVinQuery:
      name: internalVin
      in: query
      required: false
      schema:
        type: string
      description: Optional internal VIN (omitted when not provided by vehicle list)
  schemas:
    AlertCommandEntity:
      type: object
      properties:
        commandId:
          type:
          - string
          - 'null'
        curfewId:
          type:
          - string
          - 'null'
        geofenceId:
          type:
          - string
          - 'null'
    AvailableServiceItem:
      type: object
      properties:
        availableServiceId:
          type:
          - integer
          - 'null'
          format: int64
        hvacSettings:
          $ref: '#/components/schemas/HVACSettingsEntity'
        isActive:
          type:
          - boolean
          - 'null'
          default: true
        isInitial:
          type:
          - boolean
          - 'null'
          default: false
        isUIVisible:
          type:
          - boolean
          - 'null'
          default: true
        modifiedAt:
          type:
          - string
          - 'null'
        version:
          type:
          - string
          - 'null'
    AvailableServicesResponse:
      type: object
      properties:
        availableServiceForceCheck:
          type:
          - boolean
          - 'null'
          default: false
        services:
          type: array
          items:
            $ref: '#/components/schemas/AvailableServiceItem'
    BatchRequestStatusRequest:
      type: object
      required:
      - requestIdList
      properties:
        requestIdList:
          type: array
          items:
            $ref: '#/components/schemas/RequestIdItem'
    BatchRequestStatusResponse:
      type: object
      description: App model `MMBatchRequestStatusEntity`.
      properties:
        requestStatusList:
          type: array
          items:
            $ref: '#/components/schemas/RequestStatusItem'
    ChargeClimateProgramEntity:
      type: object
      properties:
        programActivationFriday:
          type:
          - boolean
          - 'null'
        programActivationMonday:
          type:
          - boolean
          - 'null'
        programActivationSaturday:
          type:
          - boolean
          - 'null'
        programActivationStatus:
          type:
          - boolean
          - 'null'
        programActivationSunday:
          type:
          - boolean
          - 'null'
        programActivationThursday:
          type:
          - boolean
          - 'null'
        programActivationTuesday:
          type:
          - boolean
          - 'null'
        programActivationWednesday:
          type:
          - boolean
          - 'null'
        programDepartureTime:
          type:
          - string
          - 'null'
        programType:
          type:
          - string
          - 'null'
    ChargeClimateScheduleEntity:
      type: object
      properties:
        chargeDuration:
          type:
          - integer
          - 'null'
          format: int32
        chargeModeRq:
          type:
          - string
          - 'null'
        chargeTimeStart:
          type:
          - string
          - 'null'
        delegatedActivated:
          type:
          - boolean
          - 'null'
        hvacSettings:
          $ref: '#/components/schemas/HvacSettings'
        isScheduleWithLocalTime:
          type: boolean
          default: false
        lastSettingsUpdateTimestamp:
          type:
          - string
          - 'null'
        preconditioningTemperature:
          type:
          - string
          - 'null'
        programs:
          type: array
          items:
            $ref: '#/components/schemas/ChargeClimateProgramEntity'
        temperatureUnit:
          type:
          - string
          - 'null'
          description: Temperature unit, `C` or `F`.
          example: C
    ChargeClimateScheduleUpdateRequest:
      type: object
      properties:
        chargeDuration:
          type:
          - integer
          - 'null'
          format: int32
        chargeModeRq:
          type:
          - string
          - 'null'
        chargeTimeStart:
          type:
          - string
          - 'null'
        delegatedActivated:
          type:
          - boolean
          - 'null'
        hvacSettings:
          $ref: '#/components/schemas/HvacSettings'
        includeChargeSchedule:
          type:
          - boolean
          - 'null'
        includeClimateSchedule:
          type:
          - boolean
          - 'null'
        internalVin:
          type:
          - string
          - 'null'
          description: Internal VIN from `getVehicleList` (`vinList`), omitted when not provided.
          example: JA4XXXXXXXXXXXXXX
        lastSettingsUpdateTimestamp:
          type:
          - string
          - 'null'
        preconditioningTemperature:
          type:
          - string
          - 'null'
        programs:
          type: array
          items:
            $ref: '#/components/schemas/ChargeClimateProgramEntity'
        scheduleAction:
          type: integer
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          description: '0 Create, 1 EditDetails, 2 EditToggle, 3 DeleteSwipe, 4 DeleteDetails, 5 SettingsCharge, 6 SettingsClimate.'
        supportPollingFlag:
