        temperatureUnit:
          type:
          - string
          - 'null'
          description: Temperature unit, `C` or `F`.
          example: C
        vin:
          type:
          - string
          - 'null'
          description: 17-character Vehicle Identification Number. Always sent for vehicle-scoped calls.
          example: JA4XXXXXXXXXXXXXX
    ChargeDetailEntity:
