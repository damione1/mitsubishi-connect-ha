openapi: 3.2.0
info:
  title: Mitsubishi Motors Connected Services API (Kintaro & IDM)
  version: 3.2.0
  description: |
    Unofficial OpenAPI specification for the Mitsubishi Motors Connected Services backend
    (StationDM **IDM** authentication + **Kintaro** vehicle & remote control API).

    ### Scope and intent
    This is a personal, non-commercial open-source project. Its only goal is to let the author
    monitor and control his own Mitsubishi vehicle (gas or PHEV) from his own Home Assistant
    smart home: the same everyday actions the official app already gives the car's owner. It
    documents only the endpoints that use case needs, so account, payment, dealer, fleet,
    pairing, notifications and similar endpoints are intentionally left out.

    It is not affiliated with or endorsed by Mitsubishi Motors and does not resell or re-expose
    their services. It is built to put no more load on the backend than the official app already
    does: it reuses one saved session instead of logging in repeatedly, reads server-cached
    telemetry on a conservative interval, and never wakes the vehicle on its own. If anything
    here is unwelcome, an issue or a message to the repository owner is the quickest way to sort
    it out.

    ### Application-Level Transport Layer
    This specification documents the **logical decrypted JSON payloads** exchanged with both services:

    1. **IDM (Authentication)**
       - All request and response bodies are wrapped in `{"payload": "<base64>"}` encrypted with **AES-256-ECB + PKCS7**.
       - Signed via `X-Signature = md5(clientId + nonce + timestamp)` (lowercase hex) with `User-Agent: okhttp/4.12.0`.
       - `/api/v1/init` requires an `app-device-token` header (HS256 JWT).

    2. **Kintaro (Vehicle & Remote Commands)**
       - Handshake `POST /service/checkVersion` returns ephemeral session keys: `encKey` (16 bytes) and `signKey` (24 bytes).
       - `GET` requests with query parameters: URL-encoded query string is encrypted with **AES-128-CBC** and sent as `?params=<url_encoded(b64)>`.
       - `POST`/`PUT` requests with body: JSON string is encrypted with **AES-128-CBC** and sent as `text/plain; charset=utf-8`.
       - Signed via `knt-sign = SHA256(encData + ts + ts[2:] + ts[2:] + signKey).upper()`.
       - Authenticated via `knt-access-token: <IDM accessToken>` (raw token, no `Bearer ` prefix).
       - Responses are wrapped in `{"state": "S"|"F", "payload": "<aes_cbc_b64>", "errorCode": ...}`.
       - Auto-recoverable error codes: `600001` (expired session key → re-run `checkVersion`), `600002`/`600004` (expired `accessToken` → call `refreshToken`).

    3. **PIN Challenge Protocol (`pinHash`)**
       - Generate `clientNonce = base64(random_32_bytes)`.
       - Call `POST /remote/generateServerNonce/v1` to obtain `serverNonce`.
       - Compute `key = b64decode(clientNonce) + ":" + b64decode(serverNonce)`.
       - Compute `digest = HMAC-SHA256(key, pin_utf8)` (32 bytes), XOR the two 16-byte halves, and Base64-encode the 16-byte result → `pinHash`.

    ### Conventions of this document
    - Every operation describes the **decrypted logical payload**. The Kintaro envelope (`KintaroEnvelope`) and IDM envelope (`IdmEnvelope`) are documented once in `components`.
    - Request `required` lists mark the fields the server expects, plus `vin` wherever a vehicle is targeted. Response schemas list no required fields except the handshake, nonce and IDM key fields: clients should tolerate missing fields.
    - Enums are set on request fields and query parameters. Response fields list known values in their description only, so unknown server values do not break generated clients.
    - `x-restrictions` flags PHEV/EV-only, primary-account-only and subscription-gated endpoints, `x-error-codes` lists endpoint-specific error codes.

    ### Errors
    Kintaro answers HTTP 200 with `state: "F"` and an `errorCode` (see `ErrorCode` and `components/responses/KintaroFailure`). IDM answers with `code != "200"` in the decrypted body (see `IdmResultCode`).

    ### Regions and backends
    Three production backends serve the official app. The country chosen when signing up selects the backend; Australia uses the Japan / Asia-Pacific backend with its own `knt-region-code`. No public staging or test host is known.

    | Backend (`{region}`) | Kintaro / IDM hosts | Countries (`knt-region-code`) |
    |---|---|---|
    | `goa-na` | `kintaro.prod.goa-na`, `idm.prod.goa-na` | US, CA (`us`) |
    | `goa-eu` | `kintaro.prod.goa-eu`, `idm.prod.goa-eu` | AT, BE, CH, CZ, DE, DK, ES, FI, FR, HU, IS, IT, NL, NO, PL, PT, RO, SE, SI, SK (`eu`) |
    | `goa` | `kintaro.prod.goa`, `idm.prod.goa` | JP, TH (`jp`), AU (`au`) |

    Each backend has its own IDM client id/secret, Kintaro `app_code`, security key settings (`sec_cfg` and IV) and, for `goa`, its own JWT signing key. The endpoint list is identical across backends. Regional differences are per-country settings:
    - residence check on `getProfile` (`checkResidenceFlag`, code `956003`): US, CA, JP, TH, AU, not Europe;
    - licence plate editing (`updateVehicle.licensePlateNumber`, `supportLicensePlateNoFlag`): JP, TH, AU;
    - kana name and prefecture fields of `UserEntity` (`firstNameKana`, `lastNameKana`, `addressPref`): Japan;
    - tax rate and payment method change (`supportChangePaymentMethodFlag`) only configured for JP, TH, AU.
servers:
- name: Kintaro
  url: https://kintaro.prod.{region}.mitsubishi-motors.com/prod
  description: Kintaro vehicle and remote API, region selected by variable
  variables:
    region:
      default: goa-na
      enum:
      - goa-na
      - goa-eu
      - goa
      description: 'Backend region: `goa-na` North America (US, CA), `goa-eu` Europe, `goa` Japan / Asia-Pacific (JP, TH, AU).'
- name: Kintaro NA
  url: https://kintaro.prod.goa-na.mitsubishi-motors.com/prod
  description: Kintaro North America (US, CA)
- name: Kintaro EU
  url: https://kintaro.prod.goa-eu.mitsubishi-motors.com/prod
  description: Kintaro Europe (20 countries)
- name: Kintaro JP
  url: https://kintaro.prod.goa.mitsubishi-motors.com/prod
  description: Kintaro Japan / Asia-Pacific (JP, TH, AU)
tags:
- name: auth
  summary: Authentication (IDM)
  description: OAuth/IDM authentication (RSA init, login, token refresh)
  kind: nav
- name: session
  summary: Kintaro session
  description: Kintaro encrypted session handshake (`checkVersion`)
  kind: nav
- name: vehicle
  summary: Vehicle
  description: Vehicle list, wake-up, OTA firmware, privacy mode, and alerts
  kind: nav
- name: alerts
  summary: Alerts
  description: Curfew, geofence and speed alerts (parental controls)
  parent: vehicle
  kind: nav
- name: status
  summary: Status & telemetry
  description: VSR telemetry (odometer, doors, range, tires), engine/HVAC state, mileage history
  kind: nav
- name: remote
  summary: Remote commands
  description: Remote commands (engine start/stop, door lock/unlock, horn, lights, GPS, POI)
  kind: nav
- name: polling
  summary: PIN nonce & polling
  description: Server PIN nonce challenge, available services, and async command status polling
  parent: remote
  kind: nav
- name: phev
  summary: PHEV / EV
  description: Endpoints specific to PHEV/EV models (charging, SOC target, electric climate)
  kind: nav
- name: charging
  summary: Charging
  description: Charging control, charge status, SOC limits, charging cost and history
  parent: phev
  kind: nav
- name: schedules
  summary: Schedules
  description: Charge, climate and combined charge/climate schedules
  parent: phev
  kind: nav
security:
- KntAccessToken: []
paths:
  /api/v1/init:
    servers:
    - name: IDM
      url: https://idm.prod.{region}.mitsubishi-motors.com
      description: IDM authentication API, region selected by variable
      variables:
        region:
          default: goa-na
          enum:
          - goa-na
          - goa-eu
          - goa
          description: 'Backend region: `goa-na` North America (US, CA), `goa-eu` Europe, `goa` Japan / Asia-Pacific (JP, TH, AU).'
    - name: IDM NA
      url: https://idm.prod.goa-na.mitsubishi-motors.com
      description: IDM North America (US, CA)
    - name: IDM EU
      url: https://idm.prod.goa-eu.mitsubishi-motors.com
      description: IDM Europe
    - name: IDM JP
      url: https://idm.prod.goa.mitsubishi-motors.com
      description: IDM Japan / Asia-Pacific (JP, TH, AU)
    post:
      operationId: idmInit
      tags:
      - auth
      summary: Initialize IDM session and fetch RSA public key
      description: |-
        IDM server endpoint. Requires `app-device-token` header (HS256 JWT).
        Returns `keyIndex` and `publicKey` (Base64 DER X.509 RSA public key)
        used to encrypt the password for `/api/v1/login`.


        Success is `code == "200"`; `code == "401"` means the access token is invalid (refresh it).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdmInitRequest'
      responses:
        '200':
          description: IDM RSA session key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdmInitResponse'
  /api/v1/login:
    servers:
    - name: IDM
      url: https://idm.prod.{region}.mitsubishi-motors.com
      description: IDM authentication API, region selected by variable
      variables:
        region:
          default: goa-na
          enum:
          - goa-na
          - goa-eu
          - goa
          description: 'Backend region: `goa-na` North America (US, CA), `goa-eu` Europe, `goa` Japan / Asia-Pacific (JP, TH, AU).'
    - name: IDM NA
      url: https://idm.prod.goa-na.mitsubishi-motors.com
      description: IDM North America (US, CA)
    - name: IDM EU
      url: https://idm.prod.goa-eu.mitsubishi-motors.com
      description: IDM Europe
    - name: IDM JP
      url: https://idm.prod.goa.mitsubishi-motors.com
      description: IDM Japan / Asia-Pacific (JP, TH, AU)
    post:
      operationId: idmLogin
      tags:
      - auth
      summary: User login (email + RSA-encrypted password)
      description: |-
        IDM server endpoint. Format `password` as `<keyIndex>@<base64(RSA_PKCS1v15(password))>`.
        Omit `app-device-token` on this endpoint.


        Success is `code == "200"`; `code == "401"` means the access token is invalid (refresh it).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdmLoginRequest'
      responses:
        '200':
          description: OAuth/IDM token bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdmTokensResponse'
  /api/v1/refreshToken:
    servers:
    - name: IDM
      url: https://idm.prod.{region}.mitsubishi-motors.com
      description: IDM authentication API, region selected by variable
      variables:
        region:
          default: goa-na
          enum:
          - goa-na
          - goa-eu
          - goa
          description: 'Backend region: `goa-na` North America (US, CA), `goa-eu` Europe, `goa` Japan / Asia-Pacific (JP, TH, AU).'
    - name: IDM NA
      url: https://idm.prod.goa-na.mitsubishi-motors.com
      description: IDM North America (US, CA)
    - name: IDM EU
      url: https://idm.prod.goa-eu.mitsubishi-motors.com
      description: IDM Europe
    - name: IDM JP
      url: https://idm.prod.goa.mitsubishi-motors.com
      description: IDM Japan / Asia-Pacific (JP, TH, AU)
    post:
      operationId: idmRefreshToken
      tags:
      - auth
      summary: Refresh IDM access token
      description: |-
        IDM server endpoint. Exchanges `refreshToken` for a fresh `accessToken`.

        Success is `code == "200"`; `code == "401"` means the access token is invalid (refresh it).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdmRefreshTokenRequest'
      responses:
        '200':
          description: Refreshed token bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdmTokensResponse'
  /api/v1/logout:
    servers:
    - name: IDM
      url: https://idm.prod.{region}.mitsubishi-motors.com
      description: IDM authentication API, region selected by variable
      variables:
        region:
          default: goa-na
          enum:
          - goa-na
          - goa-eu
          - goa
          description: 'Backend region: `goa-na` North America (US, CA), `goa-eu` Europe, `goa` Japan / Asia-Pacific (JP, TH, AU).'
    - name: IDM NA
      url: https://idm.prod.goa-na.mitsubishi-motors.com
      description: IDM North America (US, CA)
    - name: IDM EU
      url: https://idm.prod.goa-eu.mitsubishi-motors.com
      description: IDM Europe
    - name: IDM JP
      url: https://idm.prod.goa.mitsubishi-motors.com
      description: IDM Japan / Asia-Pacific (JP, TH, AU)
    post:
      operationId: idmLogout
      tags:
      - auth
      summary: Log out and revoke the current IDM session
      description: |-
        IDM server endpoint (`POST`, body encrypted as `{"payload": ...}`). Authenticated with `Authorization: Bearer <accessToken>`.

        Success is `code == "200"`; `code == "401"` means the access token is invalid (refresh it).
      security:
      - IdmBearer: []
      responses:
        '200':
          description: Decrypted IDM response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdmBaseResponse'
  /service/checkVersion:
    post:
      operationId: kintaroCheckVersion
      tags:
      - session
      summary: 'Kintaro handshake: obtain ephemeral `encKey` and `signKey`'
      description: |
        Empty request body. Signed using the static key derived from `app_code + package_name + kintaro_hash`
        and accompanied by `knt-app-device-token` (HS256 JWT).
      security: []
      responses:
        '200':
          description: Ephemeral Kintaro session keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckVersionResponse'
  /remote/generateServerNonce/v1:
    post:
      operationId: generateServerNonce
      tags:
      - polling
      - remote
      summary: Obtain a `serverNonce` for computing `pinHash`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerNonceRequest'
      responses:
        '200':
          description: Server nonce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerNonceResponse'
  /remote/getAvailableService/v1:
    get:
      operationId: getAvailableService
      tags:
      - polling
      - remote
      summary: List active remote services for the vehicle subscription
      parameters:
      - $ref: '#/components/parameters/VinQuery'
      - $ref: '#/components/parameters/InternalVinQuery'
      - name: isSecondaryVehicle
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
      responses:
        '200':
          description: Available services and activation flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableServicesResponse'
  /remote/getBatchRequestStatus/v1:
    post:
      operationId: getBatchRequestStatus
      tags:
      - polling
      - remote
      summary: Poll asynchronous status of one or more remote commands
      description: |-
        Poll every `pollingInterval` seconds (default 5 s) while `status == 1`.
        - `1`: In progress (`IN_PROGRESS`)
        - `2`: Success (`SUCCESS`)
        - Other value: Failed (`FAILED`) Response model `MMBatchRequestStatusEntity`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequestStatusRequest'
      responses:
        '200':
          description: Command status list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRequestStatusResponse'
  /remote/getSOCSetting/v1:
    get:
      operationId: getSocSetting
      tags:
      - phev
      - charging
      summary: Get SOC setting
      description: PHEV/EV only.
      parameters:
      - $ref: '#/components/parameters/VinQuery'
      - $ref: '#/components/parameters/InternalVinQuery'
      responses:
        '200':
          description: Decrypted payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SOCSettingEntity'
      x-restrictions:
      - phev-ev
  /remote/getVehicleLocation/v1:
    post:
      operationId: getVehicleLocation
      tags:
      - remote
      summary: Get vehicle GPS coordinates (Find My Car)
      description: |-
        Requires an active connected-services subscription; check `getAvailableService`.

        Known error codes: `600006`, `600007`, `956000` (see `ErrorCode`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinCommandRequest'
      responses:
        '200':
          description: Vehicle GPS coordinates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleLocationResponse'
      x-restrictions:
      - subscription
      x-error-codes:
      - '600006'
      - '600007'
      - '956000'
  /remote/lockDoor/v1:
    post:
      operationId: lockDoor
      tags:
      - remote
      summary: Lock doors remotely
      description: |-
        Requires an active connected-services subscription; check `getAvailableService`.

        Known error codes: `600006`, `600007`, `956000` (see `ErrorCode`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinCommandRequest'
      responses:
        '200':
          description: Lock command accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteCommandResponse'
      x-restrictions:
      - subscription
      x-error-codes:
      - '600006'
      - '600007'
      - '956000'
  /remote/setSOCSetting/v1:
    post:
      operationId: setSocSetting
      tags:
      - phev
      - charging
      summary: Set SOC setting
      description: PHEV/EV only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SOCSettingEntity'
      responses:
        '200':
          description: Command accepted (empty or untyped payload)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
      x-restrictions:
      - phev-ev
  /remote/startCharge/v1:
    post:
      operationId: startCharge
      tags:
      - phev
      - remote
      - charging
      summary: Start charging (PHEV/EV only)
      description: |-
        PHEV/EV only. Requires an active connected-services subscription; check `getAvailableService`.

        Known error codes: `600006`, `600007`, `956000` (see `ErrorCode`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinCommandRequest'
      responses:
        '200':
          description: Command accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteCommandResponse'
      x-restrictions:
      - phev-ev
      - subscription
      x-error-codes:
      - '600006'
      - '600007'
      - '956000'
  /remote/startClimate/v1:
    post:
      operationId: startClimate
      tags:
      - phev
      - remote
      summary: Start electric climate control (PHEV/EV only)
      description: |-
        PHEV/EV only. Requires an active connected-services subscription; check `getAvailableService`.

        Known error codes: `600006`, `600007`, `956000` (see `ErrorCode`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartEngineRequest'
      responses:
        '200':
          description: Command accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteCommandResponse'
      x-restrictions:
      - phev-ev
      - subscription
      x-error-codes:
      - '600006'
      - '600007'
      - '956000'
  /remote/startEngine/v1:
    post:
      operationId: startEngine
      tags:
      - remote
      summary: Remote engine start (with HVAC settings)
      description: |-
        Requires a valid `pinHash`.
        WARNING: Never run remote engine start in a closed garage (CO poisoning hazard).

        Requires an active connected-services subscription; check `getAvailableService`.

        Known error codes: `600006`, `600007`, `956000` (see `ErrorCode`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartEngineRequest'
      responses:
        '200':
          description: Start command accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteCommandResponse'
      x-restrictions:
      - subscription
      x-error-codes:
      - '600006'
      - '600007'
      - '956000'
  /remote/startHorn/v1:
    post:
      operationId: startHorn
      tags:
      - remote
      summary: Sound the horn remotely
      description: |-
        Requires an active connected-services subscription; check `getAvailableService`.

        Known error codes: `600006`, `600007`, `956000` (see `ErrorCode`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinCommandRequest'
      responses:
        '200':
          description: Horn command accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteCommandResponse'
      x-restrictions:
      - subscription
      x-error-codes:
      - '600006'
      - '600007'
      - '956000'
  /remote/startLight/v1:
    post:
      operationId: startLight
      tags:
      - remote
      summary: Flash headlights remotely
      description: |-
        Requires an active connected-services subscription; check `getAvailableService`.

        Known error codes: `600006`, `600007`, `956000` (see `ErrorCode`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinCommandRequest'
      responses:
        '200':
          description: Lights command accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteCommandResponse'
      x-restrictions:
      - subscription
      x-error-codes:
      - '600006'
      - '600007'
      - '956000'
  /remote/stopCharge/v1:
    post:
      operationId: stopCharge
      tags:
      - phev
      - remote
      - charging
      summary: Stop charging (PHEV/EV only)
      description: |-
        PHEV/EV only. Requires an active connected-services subscription; check `getAvailableService`.

        Known error codes: `600006`, `600007`, `956000` (see `ErrorCode`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinCommandRequest'
      responses:
        '200':
          description: Command accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteCommandResponse'
      x-restrictions:
      - phev-ev
      - subscription
      x-error-codes:
      - '600006'
      - '600007'
      - '956000'
  /remote/stopClimate/v1:
    post:
      operationId: stopClimate
      tags:
      - phev
      - remote
      summary: Stop electric climate control (PHEV/EV only)
      description: |-
        PHEV/EV only. Requires an active connected-services subscription; check `getAvailableService`.

        Known error codes: `600006`, `600007`, `956000` (see `ErrorCode`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopEngineRequest'
      responses:
        '200':
          description: Command accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteCommandResponse'
      x-restrictions:
      - phev-ev
      - subscription
      x-error-codes:
      - '600006'
      - '600007'
      - '956000'
  /remote/stopEngine/v1:
    post:
      operationId: stopEngine
      tags:
      - remote
      summary: Stop remote-started engine
      description: |-
        Does not require a PIN (`pinHash` optional).

        Requires an active connected-services subscription; check `getAvailableService`.

        Known error codes: `600006`, `600007`, `956000` (see `ErrorCode`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopEngineRequest'
      responses:
        '200':
          description: Stop command accepted
          content:
            application/json:
              schema:
