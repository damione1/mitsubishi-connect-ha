    ErrorCode:
      type: string
      enum:
      - '600001'
      - '600002'
      - '600004'
      - '600005'
      - '600006'
      - '600007'
      - '600044'
      - '700000'
      - '401005'
      - '956000'
      - '956002'
      - '956003'
      - '956005'
      - '956006'
      - '956007'
      - '956008'
      - '956011'
      - '956012'
      - '956013'
      - '956014'
      - '956017'
      - '956018'
      - '957000'
      - '958000'
      - '4'
      - '5'
      - '-1'
      - '-2'
      - '-3'
      - '-4'
      - '-5'
      - '-6'
      - '-7'
      x-enum-varnames:
      - SESSION_KEY_EXPIRED
      - FORCE_LOGOUT
      - RE_LOGIN
      - FORCE_UPDATE
      - PIN_ACCESS_TOKEN_EXPIRED
      - PIN_REFRESH_TOKEN_EXPIRED
      - ACCESS_TOKEN_REQUIRED
      - APP_MAINTENANCE
      - REQUEST_TIME_VALID_FAILED
      - PIN_VERIFY_FAILED
      - MY_QTOKEN_REQUIRED
      - CHECK_USER_RESIDENCE
      - MIGRATION_FAILED
      - PURCHASE_FAILED
      - PURCHASE_SUCCEED
      - PURCHASE_TIMEOUT
      - INVALID_ZIP_CODE
      - INVALID_ADDRESS_LINE
      - INVALID_STATE
      - INVALID_CITY
      - CHARGING_IN_PROGRESS
      - MY_QREFRESH_TOKEN_EXPIRED
      - PAIR_VEHICLE_REQUEST_ID_EXPIRED
      - PAIR_VEHICLE_OTP_CODE_WRONG
      - STRIPE_UNKNOWN_FAILED
      - FIND_MY_CAR_UNKNOWN_FAILED
      - INTERNAL_SERVER_ERROR
      - NETWORK_ERROR
      - INVALID_DATA_FORMAT_ERROR
      - CONFIG_SETUP_ERROR
      - TIMEOUT_ERROR
      - UNKNOWN_ERROR
      - CONFIG_NOT_INITIALIZED
      x-enum-descriptions:
      - Kintaro session key (`encKey`/`signKey`) expired or unknown. Re-run `POST /service/checkVersion` and retry.
      - '`ForceLogout`: IDM access token expired or revoked. Refresh it with `/api/v1/refreshToken`, otherwise log in again.'
      - '`ReLogin`: session invalidated (for example the account logged in on another device; one session per account). Refresh the token or log in again.'
      - '`ForceUpdate`: the app version sent in the headers is no longer supported.'
      - '`PinAccessTokenExpired`: the biometrics `pinAccessToken` expired. Retry with a `pinHash` or refresh it with `refreshBiometricsTokenForRemote`.'
      - '`PinRefreshTokenExpired`: the biometrics PIN refresh token expired. Re-enable biometrics (`enableBiometricsForRemote`).'
      - '`AccessTokenRequired`: `knt-access-token` missing for an authenticated endpoint.'
      - '`AppMaintenance`: backend under maintenance.'
      - '`RequestTimeValidFailed`: request timestamp rejected (clock skew or replay). Clients should treat it as a forced logout.'
      - '`PinVerifyFailed`: wrong security PIN (`pinHash` mismatch).'
      - '`MyQTokenRequired`: no myQ account linked or its token is missing.'
      - '`CheckUserResidence`: residence country check required (getProfile with `checkResidenceFlag`).'
      - '`MigrationFailed`: payment / account migration failed.'
      - '`PurchaseFailed`: the purchase failed.'
      - '`PurchaseSucceed`: purchase completed (status code reported through the error channel).'
      - '`PurchaseTimeout`: purchase still pending after the timeout.'
      - '`InvalidZipCode`: address validation rejected the postal code.'
      - '`InvalidAddressLine`: address validation rejected the street line.'
      - '`InvalidState`: address validation rejected the state / province.'
      - '`InvalidCity`: address validation rejected the city.'
      - '`ChargingInProgress`: Plug & Charge operation refused while a charging session is in progress.'
      - '`MyQRefreshTokenExpired`: myQ refresh token expired; relink the myQ account.'
      - '`PairVehicleRequestIdExpired`: pairing `requestId` expired; restart pairing.'
      - '`PairVehicleOtpCodeWrong`: wrong pairing OTP code (attempts are limited by `otpConfig.maxWrongTimes`).'
      - '`StripeUnknownFailed`: client-side code for Stripe failures, never returned by the server.'
      - '`FindMyCarUnknownFailed`: client-side code for Find My Car failures, never returned by the server.'
      - '`INTERNAL_SERVER_ERROR`: Client-side transport error, produced on the device for transport failures, never returned by the server.'
      - '`NETWORK_ERROR`: Client-side transport error, produced on the device for transport failures, never returned by the server.'
      - '`INVALID_DATA_FORMAT_ERROR`: Client-side transport error, produced on the device for transport failures, never returned by the server.'
      - '`CONFIG_SETUP_ERROR`: Client-side transport error, produced on the device for transport failures, never returned by the server.'
      - '`TIMEOUT_ERROR`: Client-side transport error, produced on the device for transport failures, never returned by the server.'
      - '`UNKNOWN_ERROR`: Client-side transport error, produced on the device for transport failures, never returned by the server.'
      - '`CONFIG_NOT_INITIALIZED`: Client-side transport error, produced on the device for transport failures, never returned by the server.'
      description: |-
        Kintaro `errorCode` values. `600001`, `600002`, `600004`, `600005`, `600044`, `700000` and `401005` can be returned by any Kintaro endpoint; the other server codes are endpoint specific (see `x-error-codes`). `4`, `5` and `-1` to `-7` are produced on the device and never sent by the server.

        | Code | App name | Meaning |
        |---|---|---|
        | `600001` | (transport, / `p017b`) | Kintaro session key (`encKey`/`signKey`) expired or unknown. Re-run `POST /service/checkVersion` and retry. |
        | `600002` | ForceLogout | IDM access token expired or revoked. Refresh it with `/api/v1/refreshToken`, otherwise log in again. |
        | `600004` | ReLogin | session invalidated (for example the account logged in on another device; one session per account). Refresh the token or log in again. |
        | `600005` | ForceUpdate | the app version sent in the headers is no longer supported. |
        | `600006` | PinAccessTokenExpired | the biometrics `pinAccessToken` expired. Retry with a `pinHash` or refresh it with `refreshBiometricsTokenForRemote`. |
        | `600007` | PinRefreshTokenExpired | the biometrics PIN refresh token expired. Re-enable biometrics (`enableBiometricsForRemote`). |
        | `600044` | AccessTokenRequired | `knt-access-token` missing for an authenticated endpoint. |
        | `700000` | AppMaintenance | backend under maintenance. |
        | `401005` | RequestTimeValidFailed | request timestamp rejected (clock skew or replay). Clients should treat it as a forced logout. |
        | `956000` | PinVerifyFailed | wrong security PIN (`pinHash` mismatch). |
        | `956002` | MyQTokenRequired | no myQ account linked or its token is missing. |
        | `956003` | CheckUserResidence | residence country check required (getProfile with `checkResidenceFlag`). |
        | `956005` | MigrationFailed | payment / account migration failed. |
        | `956006` | PurchaseFailed | the purchase failed. |
        | `956007` | PurchaseSucceed | purchase completed (status code reported through the error channel). |
        | `956008` | PurchaseTimeout | purchase still pending after the timeout. |
        | `956011` | InvalidZipCode | address validation rejected the postal code. |
        | `956012` | InvalidAddressLine | address validation rejected the street line. |
        | `956013` | InvalidState | address validation rejected the state / province. |
        | `956014` | InvalidCity | address validation rejected the city. |
        | `956017` | ChargingInProgress | Plug & Charge operation refused while a charging session is in progress. |
        | `956018` | MyQRefreshTokenExpired | myQ refresh token expired; relink the myQ account. |
        | `957000` | PairVehicleRequestIdExpired | pairing `requestId` expired; restart pairing. |
        | `958000` | PairVehicleOtpCodeWrong | wrong pairing OTP code (attempts are limited by `otpConfig.maxWrongTimes`). |
        | `4` | StripeUnknownFailed | client-side code for Stripe failures, never returned by the server. |
        | `5` | FindMyCarUnknownFailed | client-side code for Find My Car failures, never returned by the server. |
        | `-1` | INTERNAL_SERVER_ERROR | Client-side transport error, produced on the device for transport failures, never returned by the server. |
        | `-2` | NETWORK_ERROR | Client-side transport error, produced on the device for transport failures, never returned by the server. |
        | `-3` | INVALID_DATA_FORMAT_ERROR | Client-side transport error, produced on the device for transport failures, never returned by the server. |
        | `-4` | CONFIG_SETUP_ERROR | Client-side transport error, produced on the device for transport failures, never returned by the server. |
        | `-5` | TIMEOUT_ERROR | Client-side transport error, produced on the device for transport failures, never returned by the server. |
        | `-6` | UNKNOWN_ERROR | Client-side transport error, produced on the device for transport failures, never returned by the server. |
        | `-7` | CONFIG_NOT_INITIALIZED | Client-side transport error, produced on the device for transport failures, never returned by the server. |
