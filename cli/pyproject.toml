[project]
name = "mitsubishi-connect-cli"
version = "0.1.0"
description = "Interactive CLI for Mitsubishi Motors Connected Services"
requires-python = ">=3.11"
dependencies = [
    "mitsubishi-connect",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[project.scripts]
mitsubishi-connect = "mitsubishi_connect_cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mitsubishi_connect_cli"]
